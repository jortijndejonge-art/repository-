openapi: 3.1.0
info:
  title: Hockey Club Platform API
  version: 0.1.0
  description: |
    Phase 1 (MVP) API: accounts & roles, player profiles, availability,
    lineups and the suggestion engine. Schemas mirror shared/contracts/types.ts.
    FROZEN — change deliberately and keep types.ts in sync.
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /auth/magic-link:
    post:
      summary: Send a magic sign-in link by email or SMS
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                phone: { type: string }
      responses:
        '202':
          description: |
            Always 202, whether or not the email is registered, to avoid account enumeration.
            In development only, the response includes `devLink` so you can sign in without email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  devLink: { type: string }

  /auth/magic-link/verify:
    post:
      summary: Exchange a magic-link token for a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: 'Signed in. Send "Authorization: Bearer <accessToken>" on later requests.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { description: Invalid, expired or already-used token }

  /auth/login:
    post:
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { description: Wrong email or password (the same answer for both) }
        '429': { description: Too many wrong attempts; try again later }

  /me/password:
    put:
      summary: Set or change your password (changing needs the current one)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 10 }
      responses:
        '204': { description: Password saved }
        '400': { description: New password too short }
        '401': { description: Current password is wrong }

  /auth/logout:
    post:
      summary: End the current session
      responses:
        '204': { description: Signed out }

  /me:
    get:
      summary: Current member with club, teams and roles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }

  /me/memberships:
    get:
      summary: My club memberships (subscription status)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MembershipRecord' } }

  /members/{memberId}/invite:
    parameters: [{ $ref: '#/components/parameters/memberId' }]
    post:
      summary: Email a member a magic link to join (manager of one of their teams)
      responses:
        '202': { description: Invite sent }
        '403': { description: Not a manager of this member }

  /payments/config:
    get:
      summary: Whether online payments are switched on
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentsConfig' }

  /membership-plans/{planId}/checkout:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    post:
      summary: Start a Stripe Checkout for a membership plan; returns the page to send the member to
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
        '503': { description: Payments are not set up yet }

  /webhooks/stripe:
    post:
      summary: Stripe webhook (signature-verified; records payments and updates memberships)
      responses:
        '200': { description: Event handled or ignored }
        '400': { description: Bad signature }
        '503': { description: Payments are not set up yet }

  /clubs/{clubId}/membership-plans:
    parameters: [{ $ref: '#/components/parameters/clubId' }]
    post:
      summary: Add a membership plan (club admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMembershipPlan' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipPlan' }
    get:
      summary: Membership plans offered by the club
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MembershipPlan' } }

  /clubs/{clubId}/teams:
    parameters: [{ $ref: '#/components/parameters/clubId' }]
    get:
      summary: List teams in a club
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Team' } }

  /teams/{teamId}/players:
    parameters: [{ $ref: '#/components/parameters/teamId' }]
    get:
      summary: Squad for a team
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlayerProfile' } }
    post:
      summary: Add a new player to the squad (manager/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPlayer' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerProfile' }

  /teams/{teamId}/players/{memberId}:
    parameters:
      - { $ref: '#/components/parameters/teamId' }
      - { $ref: '#/components/parameters/memberId' }
    patch:
      summary: Edit positions / ratings (manager/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlayerProfileUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerProfile' }

  /teams/{teamId}/players/{memberId}/login:
    parameters:
      - { $ref: '#/components/parameters/teamId' }
      - { $ref: '#/components/parameters/memberId' }
    post:
      summary: Create (or reset) a player's sign-in password, optionally setting their email (manager/admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
      responses:
        '200':
          description: The new password, shown once
          content:
            application/json:
              schema:
                type: object
                required: [email, password]
                properties:
                  email: { type: string }
                  password: { type: string }
        '400': { description: No email address for this player }
        '409': { description: Email already used by someone else in the club }

  /teams/{teamId}/players/{memberId}/guardians:
    parameters:
      - { $ref: '#/components/parameters/teamId' }
      - { $ref: '#/components/parameters/memberId' }
    get:
      summary: A player's parents/guardians (manager/admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GuardianSummary' } }
    post:
      summary: Link a parent to a player, creating the parent if needed (manager/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewGuardian' }
      responses:
        '201':
          description: Linked. A new parent also gets a first password, shown once.
          content:
            application/json:
              schema:
                type: object
                required: [guardian]
                properties:
                  guardian: { $ref: '#/components/schemas/GuardianSummary' }
                  password: { type: string }

  /teams/{teamId}/import:
    parameters: [{ $ref: '#/components/parameters/teamId' }]
    post:
      summary: Bulk-add players from a spreadsheet (manager/admin). One bad row never stops the rest; skipped rows come back with a reason, and new sign-ins are returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '200':
          description: What was created and what was skipped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }

  /teams/{teamId}/fixtures:
    parameters: [{ $ref: '#/components/parameters/teamId' }]
    post:
      summary: Add a fixture (manager/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewFixture' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fixture' }
    get:
      summary: Fixtures for a team, soonest first (POST adds one: manager/admin)
      parameters:
        - name: from
          in: query
          description: Only fixtures starting at or after this time
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Fixture' } }

  /teams/{teamId}/stats:
    parameters: [{ $ref: '#/components/parameters/teamId' }]
    get:
      summary: Season stats per player - training attended, matches available for, minutes played (manager/admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlayerStats' } }

  /fixtures/{fixtureId}/briefing:
    parameters:
      - { name: fixtureId, in: path, required: true, schema: { type: string } }
    get:
      summary: The pre-match briefing, or null. `seen` says whether you (or the child in `memberId`) read this version.
      parameters:
        - { name: memberId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                nullable: true
                allOf: [{ $ref: '#/components/schemas/Briefing' }]
    put:
      summary: Create or replace the briefing (manager/admin). Editing resets everyone to unseen. Links must be http(s).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewBriefing' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Briefing' }
    delete:
      summary: Remove the briefing (manager/admin)
      responses:
        '204': { description: Deleted }

  /fixtures/{fixtureId}/briefing/reads:
    parameters:
      - { name: fixtureId, in: path, required: true, schema: { type: string } }
    get:
      summary: Who in the squad has read the current briefing (manager/admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BriefingRead' } }

  /fixtures/{fixtureId}/briefing/seen:
    parameters:
      - { name: fixtureId, in: path, required: true, schema: { type: string } }
    post:
      summary: Mark the briefing as read, for yourself or (as a parent or manager) for a player in `memberId`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                memberId: { type: string }
      responses:
        '204': { description: Saved }

  /fixtures/{fixtureId}/live:
    parameters:
      - { name: fixtureId, in: path, required: true, schema: { type: string } }
    get:
      summary: The live clock and substitutions for a match, or null if it has not been started
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                nullable: true
                allOf: [{ $ref: '#/components/schemas/LiveMatch' }]

  /fixtures/{fixtureId}/live/{action}:
    parameters:
      - { name: fixtureId, in: path, required: true, schema: { type: string } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [start, pause, resume, finish] } }
    post:
      summary: Start (needs a saved lineup), pause, resume or finish the match clock (manager/admin). Finishing adds minutes to each player's season total, once.
      responses:
        '200':
          description: The new state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveMatch' }
        '409': { description: Not allowed in the match's current state }

  /fixtures/{fixtureId}/live/substitute:
    parameters:
      - { name: fixtureId, in: path, required: true, schema: { type: string } }
    post:
      summary: Make a substitution now (manager/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotId, offMemberId, onMemberId]
              properties:
                slotId: { type: string }
                offMemberId: { type: string }
                onMemberId: { type: string }
      responses:
        '200':
          description: The new state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveMatch' }
        '409': { description: Player not in that position, or not available on the bench }

  /teams/{teamId}/announcements:
    parameters: [{ $ref: '#/components/parameters/teamId' }]
    get:
      summary: A team's announcements, newest first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Announcement' } }
    post:
      summary: Post an announcement to the squad (manager/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewAnnouncement' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }

  /announcements/{announcementId}:
    parameters:
      - { name: announcementId, in: path, required: true, schema: { type: string } }
    delete:
      summary: Delete an announcement (manager/admin of its team)
      responses:
        '204': { description: Deleted }

  /teams/{teamId}/training:
    parameters: [{ $ref: '#/components/parameters/teamId' }]
    get:
      summary: Training sessions for a team, soonest first
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TrainingSession' } }
    post:
      summary: Add a training session (manager/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTrainingSession' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingSession' }

  /training/{sessionId}:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    patch:
      summary: Edit a training session (manager/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTrainingSession' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingSession' }
    delete:
      summary: Delete a training session (manager/admin)
      responses:
        '204': { description: Deleted }

  /training/{sessionId}/responses:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      summary: The whole squad's RSVPs and recorded attendance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TrainingResponse' } }

  /training/{sessionId}/rsvp:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    put:
      summary: Answer for yourself (or, as a manager, for a player)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId, status]
              properties:
                memberId: { type: string }
                status: { type: string, enum: [available, unavailable, maybe, no_response] }
      responses:
        '204': { description: Saved }

  /training/{sessionId}/attendance:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    put:
      summary: Record whether a player attended (manager/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId, attended]
              properties:
                memberId: { type: string }
                attended: { type: boolean }
      responses:
        '204': { description: Saved }

  /fixtures/{fixtureId}:
    parameters:
      - { name: fixtureId, in: path, required: true, schema: { type: string } }
    patch:
      summary: Edit a fixture (manager/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixtureUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fixture' }
    delete:
      summary: Delete a fixture with its availability and lineup (manager/admin)
      responses:
        '204': { description: Deleted }

  /fixtures/{fixtureId}/availability:
    parameters: [{ $ref: '#/components/parameters/fixtureId' }]
    get:
      summary: Availability of every squad member for a fixture
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Availability' } }
    put:
      summary: Set my (or my child's) availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId, status]
              properties:
                memberId: { type: string }
                status: { $ref: '#/components/schemas/AvailabilityStatus' }
                note: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }

  /formations:
    get:
      summary: Built-in formations, optionally filtered by squad format
      parameters:
        - name: format
          in: query
          schema: { $ref: '#/components/schemas/SquadFormat' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Formation' } }

  /teams/{teamId}/formations:
    parameters: [{ $ref: '#/components/parameters/teamId' }]
    get:
      summary: This team's custom formations, optionally filtered by squad format
      parameters:
        - name: format
          in: query
          schema: { $ref: '#/components/schemas/SquadFormat' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Formation' } }
    post:
      summary: Save a custom formation from typed line counts (manager/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewCustomFormation' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Formation' }
        '400':
          description: Line counts don't total 5, 7, or 11 including the keeper

  /teams/{teamId}/formation-layouts:
    parameters: [{ $ref: '#/components/parameters/teamId' }]
    get:
      summary: This team's saved position adjustments, one per formation they've adjusted
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FormationLayout' } }

  /teams/{teamId}/formation-layouts/{formationId}:
    parameters:
      - { $ref: '#/components/parameters/teamId' }
      - { name: formationId, in: path, required: true, schema: { type: string } }
    put:
      summary: Save adjusted positions for a formation (manager/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positions]
              properties:
                positions:
                  type: object
                  additionalProperties: { $ref: '#/components/schemas/PitchPosition' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormationLayout' }
        '400':
          description: Unknown formation, or a position id that isn't in it
    delete:
      summary: Reset a formation back to its automatic layout (manager/admin)
      responses:
        '204': { description: Reset }

  /fixtures/{fixtureId}/lineup:
    parameters: [{ $ref: '#/components/parameters/fixtureId' }]
    get:
      summary: Current lineup for a fixture
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lineup' }
        '404': { description: No lineup yet }
    put:
      summary: Save the lineup (manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Lineup' }
      responses:
        '200': { description: Saved }

  /fixtures/{fixtureId}/lineup/suggest:
    parameters: [{ $ref: '#/components/parameters/fixtureId' }]
    post:
      summary: Ask the suggestion engine for a lineup + substitution plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuggestionRequest' }
      responses:
        '200':
          description: Suggestion (not saved until the manager saves it)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestionResult' }

  /fixtures/{fixtureId}/lineup/share:
    parameters: [{ $ref: '#/components/parameters/fixtureId' }]
    post:
      summary: Share the saved lineup with selected players (default everyone in it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                memberIds:
                  type: array
                  items: { type: string }
                  description: Omit to share with the whole squad
      responses:
        '202':
          description: Notifications sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sharedWith: { type: integer }
        '409': { description: No saved lineup to share }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }

  parameters:
    clubId: { name: clubId, in: path, required: true, schema: { type: string } }
    teamId: { name: teamId, in: path, required: true, schema: { type: string } }
    memberId: { name: memberId, in: path, required: true, schema: { type: string } }
    fixtureId: { name: fixtureId, in: path, required: true, schema: { type: string } }

  schemas:
    Role: { type: string, enum: [admin, manager, player, guardian] }
    AgeGroup: { type: string, enum: [U8, U10, U12, U14, U16, U18, Adult] }
    SquadFormat: { type: integer, enum: [5, 7, 11] }
    PositionLine: { type: string, enum: [GK, DEF, MID, FWD] }
    AvailabilityStatus: { type: string, enum: [available, unavailable, maybe, no_response] }
    SuggestionStrategy: { type: string, enum: [fair, strongest, stamina] }

    Member:
      type: object
      required: [id, clubId, firstName, lastName]
      properties:
        id: { type: string }
        clubId: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string }

    TeamMembership:
      type: object
      required: [teamId, memberId, roles]
      properties:
        teamId: { type: string }
        memberId: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }

    Team:
      type: object
      required: [id, clubId, name, ageGroup, defaultFormat]
      properties:
        id: { type: string }
        clubId: { type: string }
        name: { type: string }
        ageGroup: { $ref: '#/components/schemas/AgeGroup' }
        defaultFormat: { $ref: '#/components/schemas/SquadFormat' }

    PlayerProfile:
      type: object
      required: [memberId, displayName, positions, skill, stamina, seasonMinutes]
      properties:
        memberId: { type: string }
        displayName: { type: string }
        shirtNumber: { type: integer }
        positions: { type: array, items: { $ref: '#/components/schemas/PositionLine' } }
        skill: { type: integer, minimum: 1, maximum: 10 }
        stamina: { type: integer, minimum: 1, maximum: 10 }
        seasonMinutes: { type: integer, minimum: 0 }

    Fixture:
      type: object
      required: [id, teamId, opponent, startsAt, venue, homeAway, format, durationMinutes, periods]
      properties:
        id: { type: string }
        teamId: { type: string }
        opponent: { type: string }
        startsAt: { type: string, format: date-time }
        venue: { type: string }
        homeAway: { type: string, enum: [home, away] }
        format: { $ref: '#/components/schemas/SquadFormat' }
        durationMinutes: { type: integer }
        periods: { type: integer }

    ImportRow:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string }
        shirtNumber: { type: integer }
        positions: { type: array, items: { type: string, enum: [GK, DEF, MID, FWD] } }
        guardianEmail: { type: string }
        guardianFirstName: { type: string }
        guardianLastName: { type: string }

    ImportRequest:
      type: object
      required: [players, createLogins]
      properties:
        players: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/ImportRow' } }
        createLogins: { type: boolean }

    ImportResult:
      type: object
      required: [created, guardiansLinked, skipped, logins]
      properties:
        created: { type: integer }
        guardiansLinked: { type: integer }
        skipped:
          type: array
          items:
            type: object
            required: [index, name, reason]
            properties:
              index: { type: integer }
              name: { type: string }
              reason: { type: string }
        logins:
          type: array
          items:
            type: object
            required: [name, email, password, role]
            properties:
              name: { type: string }
              email: { type: string }
              password: { type: string }
              role: { type: string }

    PlayerStats:
      type: object
      required: [memberId, displayName, trainingAttended, trainingTotal, matchesAvailable, matchesTotal, seasonMinutes]
      properties:
        memberId: { type: string }
        displayName: { type: string }
        trainingAttended: { type: integer }
        trainingTotal: { type: integer, description: Past sessions where attendance was recorded }
        matchesAvailable: { type: integer }
        matchesTotal: { type: integer, description: Matches already past their start time }
        seasonMinutes: { type: integer }

    Briefing:
      type: object
      required: [fixtureId, body, links, updatedAt]
      properties:
        fixtureId: { type: string }
        body: { type: string }
        links:
          type: array
          items:
            type: object
            required: [label, url]
            properties:
              label: { type: string }
              url: { type: string }
        updatedAt: { type: string, format: date-time }
        seen: { type: boolean }

    NewBriefing:
      type: object
      required: [body, links]
      properties:
        body: { type: string, maxLength: 5000 }
        links:
          type: array
          maxItems: 10
          items:
            type: object
            required: [label, url]
            properties:
              label: { type: string }
              url: { type: string }

    BriefingRead:
      type: object
      required: [memberId, seen]
      properties:
        memberId: { type: string }
        seen: { type: boolean }

    LiveMatch:
      type: object
      required: [fixtureId, status, elapsedSeconds, substitutions]
      properties:
        fixtureId: { type: string }
        status: { type: string, enum: [running, paused, finished] }
        elapsedSeconds: { type: integer }
        substitutions:
          type: array
          items:
            type: object
            required: [atSecond, slotId, offMemberId, onMemberId]
            properties:
              atSecond: { type: integer }
              slotId: { type: string }
              offMemberId: { type: string }
              onMemberId: { type: string }

    GuardianSummary:
      type: object
      required: [memberId, firstName, lastName]
      properties:
        memberId: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }

    NewGuardian:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }

    Announcement:
      type: object
      required: [id, teamId, authorName, title, body, createdAt]
      properties:
        id: { type: string }
        teamId: { type: string }
        authorName: { type: string }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    NewAnnouncement:
      type: object
      required: [title, body]
      properties:
        title: { type: string, maxLength: 120 }
        body: { type: string, maxLength: 4000 }

    TrainingSession:
      type: object
      required: [id, teamId, startsAt, durationMinutes, venue]
      properties:
        id: { type: string }
        teamId: { type: string }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer }
        venue: { type: string }
        notes: { type: string }

    NewTrainingSession:
      type: object
      description: A TrainingSession without id and teamId. PATCH accepts any subset.
      required: [startsAt, durationMinutes, venue]
      properties:
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer }
        venue: { type: string }
        notes: { type: string }

    TrainingResponse:
      type: object
      required: [sessionId, memberId, rsvp]
      properties:
        sessionId: { type: string }
        memberId: { type: string }
        rsvp: { type: string, enum: [available, unavailable, maybe, no_response] }
        attended: { type: boolean }

    NewFixture:
      type: object
      required: [opponent, startsAt, venue, homeAway, format, durationMinutes, periods]
      properties:
        opponent: { type: string }
        startsAt: { type: string, format: date-time }
        venue: { type: string }
        homeAway: { type: string, enum: [home, away] }
        format: { $ref: '#/components/schemas/SquadFormat' }
        durationMinutes: { type: integer }
        periods: { type: integer }

    FixtureUpdate:
      type: object
      description: Any subset of the NewFixture fields.
      properties:
        opponent: { type: string }
        startsAt: { type: string, format: date-time }
        venue: { type: string }
        homeAway: { type: string, enum: [home, away] }
        format: { $ref: '#/components/schemas/SquadFormat' }
        durationMinutes: { type: integer }
        periods: { type: integer }

    Availability:
      type: object
      required: [fixtureId, memberId, status, updatedAt]
      properties:
        fixtureId: { type: string }
        memberId: { type: string }
        status: { $ref: '#/components/schemas/AvailabilityStatus' }
        note: { type: string }
        updatedAt: { type: string, format: date-time }

    FormationSlot:
      type: object
      required: [id, label, line, x, y]
      properties:
        id: { type: string }
        label: { type: string }
        line: { $ref: '#/components/schemas/PositionLine' }
        x: { type: number, description: '0–100, left to right' }
        y: { type: number, description: '0–100, attacking D (top) to own goal (bottom)' }

    Formation:
      type: object
      required: [id, name, format, slots]
      properties:
        id: { type: string }
        name: { type: string }
        format: { $ref: '#/components/schemas/SquadFormat' }
        slots: { type: array, items: { $ref: '#/components/schemas/FormationSlot' } }
        teamId: { type: string, description: "Present only for a team's saved custom formation" }

    PitchPosition:
      type: object
      required: [x, y]
      properties:
        x: { type: number, minimum: 0, maximum: 100, description: '0–100, left to right' }
        y: { type: number, minimum: 0, maximum: 100, description: '0–100, halfway (0) to our back line (100)' }

    FormationLayout:
      type: object
      required: [formationId, positions]
      properties:
        formationId: { type: string }
        positions:
          type: object
          description: Per position id; overrides the automatic layout for that position
          additionalProperties: { $ref: '#/components/schemas/PitchPosition' }

    NewCustomFormation:
      type: object
      required: [name, lines]
      properties:
        name: { type: string }
        lines:
          type: array
          minItems: 2
          maxItems: 4
          items: { type: integer, minimum: 1, maximum: 5 }
          description: 'Line counts defence-first through attack, e.g. [4, 3, 3]. GK is implicit; outfield + 1 must total 5, 7, or 11.'

    SlotAssignment:
      type: object
      required: [slotId, memberId]
      properties:
        slotId: { type: string }
        memberId: { type: [string, 'null'] }

    Substitution:
      type: object
      required: [minute, slotId, offMemberId, onMemberId]
      properties:
        minute: { type: integer }
        slotId: { type: string }
        offMemberId: { type: string }
        onMemberId: { type: string }

    Lineup:
      type: object
      required: [id, fixtureId, formationId, strategy, starting, bench, substitutions, updatedAt]
      properties:
        id: { type: string }
        fixtureId: { type: string }
        formationId: { type: string }
        strategy:
          oneOf:
            - { $ref: '#/components/schemas/SuggestionStrategy' }
            - { type: string, enum: [manual] }
        starting: { type: array, items: { $ref: '#/components/schemas/SlotAssignment' } }
        bench: { type: array, items: { type: string } }
        substitutions: { type: array, items: { $ref: '#/components/schemas/Substitution' } }
        sharedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NewPlayer:
      type: object
      required: [firstName, lastName, positions, skill, stamina]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string }
        displayName: { type: string, description: 'Defaults to "First L."' }
        shirtNumber: { type: integer }
        positions: { type: array, items: { $ref: '#/components/schemas/PositionLine' } }
        skill: { type: integer, minimum: 1, maximum: 10 }
        stamina: { type: integer, minimum: 1, maximum: 10 }

    PlayerProfileUpdate:
      type: object
      properties:
        displayName: { type: string }
        shirtNumber: { type: integer }
        positions: { type: array, items: { $ref: '#/components/schemas/PositionLine' } }
        skill: { type: integer, minimum: 1, maximum: 10 }
        stamina: { type: integer, minimum: 1, maximum: 10 }
        seasonMinutes: { type: integer, minimum: 0 }

    Club:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    Me:
      type: object
      required: [member, club, memberships, teams]
      properties:
        member: { $ref: '#/components/schemas/Member' }
        club: { $ref: '#/components/schemas/Club' }
        memberships: { type: array, items: { $ref: '#/components/schemas/TeamMembership' } }
        teams: { type: array, items: { $ref: '#/components/schemas/Team' } }

    AuthSession:
      type: object
      required: [accessToken, me]
      properties:
        accessToken: { type: string }
        me: { $ref: '#/components/schemas/Me' }

    MembershipPlan:
      type: object
      required: [id, clubId, name, amountPence, interval]
      properties:
        id: { type: string }
        clubId: { type: string }
        name: { type: string }
        amountPence: { type: integer }
        interval: { type: string, enum: [month, quarter, year] }

    NewMembershipPlan:
      type: object
      required: [name, amountPence, interval]
      properties:
        name: { type: string }
        amountPence: { type: integer, minimum: 1 }
        interval: { type: string, enum: [month, quarter, year] }

    PaymentsConfig:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    CheckoutSession:
      type: object
      properties:
        url: { type: string }
        demo: { type: boolean }

    MembershipRecord:
      type: object
      required: [memberId, planId, status]
      properties:
        memberId: { type: string }
        planId: { type: string }
        status: { type: string, enum: [active, overdue, cancelled] }
        nextPaymentDue: { type: string, format: date-time }

    SuggestionRequest:
      type: object
      required: [fixtureId, formationId, strategy]
      properties:
        fixtureId: { type: string }
        formationId: { type: string }
        strategy: { $ref: '#/components/schemas/SuggestionStrategy' }
        locked: { type: array, items: { $ref: '#/components/schemas/SlotAssignment' } }

    SuggestionResult:
      type: object
      required: [starting, bench, substitutions, projectedMinutes, warnings]
      properties:
        starting: { type: array, items: { $ref: '#/components/schemas/SlotAssignment' } }
        bench: { type: array, items: { type: string } }
        substitutions: { type: array, items: { $ref: '#/components/schemas/Substitution' } }
        projectedMinutes:
          type: object
          additionalProperties: { type: integer }
        warnings: { type: array, items: { type: string } }
